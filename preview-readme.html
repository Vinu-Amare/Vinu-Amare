<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>README preview</title>
<style>
  /* rough GitHub profile README look, light + dark */
  body { margin: 0; font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; background: #f6f8fa; }
  .theme { padding: 24px 16px; }
  .light { background: #ffffff; color: #1f2328; --border: #d1d9e0; --muted: #59636e; --link: #0969da; }
  .dark { background: #0d1117; color: #f0f6fc; --border: #3d444d; --muted: #9198a1; --link: #4493f8; }
  .label { max-width: 830px; margin: 0 auto 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .box { max-width: 830px; margin: 0 auto; border: 1px solid var(--border); border-radius: 6px; padding: 24px; box-sizing: border-box; }
  .md h2 { font-size: 1.5em; font-weight: 600; padding-bottom: .3em; border-bottom: 1px solid var(--border); margin: 24px 0 16px; }
  .md p, .md ul { margin: 0 0 16px; }
  .md ul { padding-left: 2em; }
  .md li + li { margin-top: .25em; }
  .md a { color: var(--link); text-decoration: none; }
  .md img { max-width: 100%; box-sizing: content-box; }
  .md img[align="right"] { padding-left: 20px; }
  .md li img { vertical-align: middle; }
  .md > *:first-child { margin-top: 0; }
  .md table { border-collapse: collapse; margin: 0 0 16px; }
  .md td { border: 1px solid var(--border); padding: 6px 13px; }
  .md sub { font-size: 75%; line-height: 1.6; }
</style>
</head>
<body>
  <section class="theme light"><div class="label">GitHub light</div><article class="box md"></article></section>
  <section class="theme dark"><div class="label">GitHub dark</div><article class="box md"></article></section>
<script>
  // Tiny markdown renderer: just enough for this README (raw HTML passes through).
  const inline = (s) => s
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');

  function render(md) {
    const out = [];
    let list = null, para = [];
    const flush = () => {
      if (para.length) out.push(`<p>${inline(para.join(' '))}</p>`), (para = []);
      if (list) out.push(`<ul>${list.join('')}</ul>`), (list = null);
    };
    for (const line of md.split('\n')) {
      if (!line.trim()) { flush(); continue; }
      if (line.startsWith('## ')) { flush(); out.push(`<h2>${inline(line.slice(3))}</h2>`); continue; }
      if (line.startsWith('- ')) { if (para.length) flush(); (list ||= []).push(`<li>${inline(line.slice(2))}</li>`); continue; }
      if (/^\s*</.test(line)) { flush(); out.push(line); continue; }
      para.push(line);
    }
    flush();
    return out.join('\n');
  }

  const v = Date.now();
  fetch('README.md?v=' + v).then((r) => r.text()).then((md) => {
    const html = render(md).replace(/(src|srcset)="(assets\/[^"]+)"/g, `$1="$2?v=${v}"`);
    document.querySelectorAll('.md').forEach((el) => (el.innerHTML = html));
    // GitHub picks <source> by the viewer's theme; force it per panel here
    document.querySelectorAll('.dark picture').forEach((p) => (p.querySelector('img').src = p.querySelector('source').srcset));
    document.querySelectorAll('.light picture source').forEach((s) => s.remove());
  });
</script>
</body>
</html>
